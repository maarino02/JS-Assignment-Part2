<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="calculator" aria-label="Calculator">
        <output class="calculator__display" data-display aria-live="polite" aria-atomic="true">0</output>
        <div class="calculator__keys">
            <button class="key key--action" type="button" data-action="clear">AC</button>
            <button class="key key--action" type="button" data-action="backspace" aria-label="Backspace">&#8998;</button>
            <button class="key key--operator" type="button" data-operator="/" aria-label="Divide">&divide;</button>
            <button class="key" type="button" data-number="7">7</button>
            <button class="key" type="button" data-number="8">8</button>
            <button class="key" type="button" data-number="9">9</button>
            <button class="key key--operator" type="button" data-operator="*" aria-label="Multiply">&times;</button>
            <button class="key" type="button" data-number="4">4</button>
            <button class="key" type="button" data-number="5">5</button>
            <button class="key" type="button" data-number="6">6</button>
            <button class="key key--operator" type="button" data-operator="-" aria-label="Subtract">&minus;</button>
            <button class="key" type="button" data-number="1">1</button>
            <button class="key" type="button" data-number="2">2</button>
            <button class="key" type="button" data-number="3">3</button>
            <button class="key key--operator" type="button" data-operator="+" aria-label="Add">+</button>
            <button class="key key--zero" type="button" data-number="0">0</button>
            <button class="key" type="button" data-action="decimal">.</button>
            <button class="key key--equals" type="button" data-action="equals">=</button>
        </div>
    </main>
</body>
</html>
